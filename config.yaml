# Products, ERCOT endpoints and pipeline settings: the single source for all of them.
# Python never hardcodes product IDs, bucket names or regions; it reads this file plus env.
# The lake layout, schemas and time zone are fixed by ercot_lake.contract, not configured here.
#
# Every product listed here is collected: it gets a schedule and a freshness check. To stop
# collecting one, remove its entry; the data already in the lake stays readable.
#
# `stale_after_min` is the age of the newest posting (minutes) past which a gap is forming and
# someone should look. The freshness check counts products past it into one metric,
# StaleProducts, which one alarm watches.

ercot:
  api_base: https://api.ercot.com/api/public-reports
  archive_base: https://api.ercot.com/api/public-reports/archive
  # Azure AD B2C resource-owner-password flow used by the ERCOT Public API. The client ID is
  # ERCOT's published public client, not a secret.
  auth:
    token_url: https://ercotb2c.b2clogin.com/ercotb2c.onmicrosoft.com/B2C_1_PUBAPI-ROPC-FLOW/oauth2/v2.0/token
    client_id: fec253ea-0d06-4272-a5e6-b478baeecd70
    scope: "openid fec253ea-0d06-4272-a5e6-b478baeecd70 offline_access"
  page_size: 1000
  timeout_s: 60
  max_retries: 8             # backfill and explicit windows
  live_max_retries: 3        # scheduled runs give up within a minute; the next run is the retry
  min_interval_s: 2.0        # ERCOT returns 429 readily; pace every request

state:
  # Watermarks. local writes <local_dir>/<product>.json; the Lambda sets STATE_BACKEND=dynamodb.
  backend: local
  local_dir: ./data/state
  dynamodb_table: ercot-ingest-state

lake:
  # Overridden by LAKE_ROOT. A local directory offline, s3://<bucket> when deployed.
  root: ./data

products:
  np4-190-cd:
    name: DAM settlement point prices
    archive_id: NP4-190-CD
    endpoint: /np4-190-cd/dam_stlmnt_pnt_prices
    table: spp
    cadence: daily
    interval_minutes: 60
    post_time_ct: "12:30-13:00 (observed)"
    schedule: "cron(0/5 12-14 * * ? *)"   # poll every 5 min 12:00-14:55 CT; first hit takes it
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 72   # first run with no watermark: how far back to list postings
    stale_after_min: 1560   # 26 h: today's ~12:35 CT posting still missing at ~14:35 CT, as polling ends
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        delivery_date: [deliveryDate, DeliveryDate]
        hour_ending: [hourEnding, HourEnding]
        settlement_point: [settlementPoint, SettlementPoint]
        price_mwh: [settlementPointPrice, SettlementPointPrice]
        dst_flag: [DSTFlag, DSTFlag]

  np4-188-cd:
    name: DAM AS clearing prices (MCPC)
    archive_id: NP4-188-CD
    endpoint: /np4-188-cd/dam_clear_price_for_cap
    table: mcpc
    cadence: daily
    interval_minutes: 60
    post_time_ct: "12:30-13:00 (observed)"
    schedule: "cron(0/5 12-14 * * ? *)"   # poll every 5 min 12:00-14:55 CT; first hit takes it
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 72
    stale_after_min: 1560   # as np4-190-cd
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        delivery_date: [deliveryDate, DeliveryDate]
        hour_ending: [hourEnding, HourEnding]
        as_type: [ancillaryType, AncillaryType]
        mcpc_mw: [MCPC, MCPC]
        dst_flag: [DSTFlag, DSTFlag]

  np6-905-cd:
    name: RT settlement point prices, 15-min
    archive_id: NP6-905-CD
    endpoint: /np6-905-cd/spp_node_zone_hub
    table: spp
    cadence: 15min
    interval_minutes: 15
    post_time_ct: "+2m after interval end; listable in the archive ~3 min later (varies)"
    schedule: "cron(* * * * ? *)"      # poll every minute; a run with nothing new is one listing call
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 6
    stale_after_min: 60   # normal peak ~19 min just before the next posting
    transform:
      time: hour_interval
      columns:                # canonical: [API field, archive CSV header]
        delivery_date: [deliveryDate, DeliveryDate]
        delivery_hour: [deliveryHour, DeliveryHour]
        delivery_interval: [deliveryInterval, DeliveryInterval]
        settlement_point: [settlementPoint, SettlementPointName]
        settlement_point_type: [settlementPointType, SettlementPointType]
        price_mwh: [settlementPointPrice, SettlementPointPrice]
        dst_flag: [DSTFlag, DSTFlag]

  np6-331-cd:
    name: RT AS clearing prices, 15-min (RTC+B)
    archive_id: NP6-331-CD
    # On the Public API since RTC+B went live, 2025-12-05.
    endpoint: /np6-331-cd/rt_clear_price_cap
    # ERCOT's yearly workbook of the same prices: fills gaps in the regular postings (backfill
    # only, never polled).
    fallback_archive_id: NP6-796-ER
    table: mcpc
    cadence: 15min
    interval_minutes: 15
    post_time_ct: "+2m after interval end; listable in the archive ~3 min later (varies)"
    schedule: "cron(* * * * ? *)"
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 6
    stale_after_min: 60   # as np6-905-cd
    transform:
      time: hour_interval
      columns:                # canonical: [API field, archive CSV header]
        delivery_date: [deliveryDate, DeliveryDate]
        delivery_hour: [deliveryHour, DeliveryHour]
        delivery_interval: [deliveryInt, DeliveryInterval]
        dst_flag: [repeatHourFlag, RepeatedHourFlag]
        as_type: [ASType, ASType]
        mcpc_mw: [MCPC, MCPC]

  # System series: load, wind and solar reports and the SCED system lambda, melted into the
  # series table. Collected from the dates below; earlier intervals are not gaps.
  np3-565-cd:
    name: Seven-day load forecast by weather zone (in-use model)
    archive_id: NP3-565-CD
    endpoint: /np3-565-cd/lf_by_model_weather_zone
    table: series
    cadence: hourly
    interval_minutes: 60
    post_time_ct: "hourly at ~:30"
    schedule: "cron(*/5 * * * ? *)"     # poll every 5 min; one listing call when nothing is new
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 6
    stale_after_min: 240   # hourly; normal peak ~65 min
    collected_from: "2026-09-17T11:00:00Z"
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        posted_datetime: [postedDatetime, null]
        delivery_date: [deliveryDate, DeliveryDate]
        hour_ending: [hourEnding, HourEnding]
        coast: [coast, Coast]
        east: [east, East]
        far_west: [farWest, FarWest]
        north: [north, North]
        north_central: [northCentral, NorthCentral]
        south_central: [southCentral, SouthCentral]
        southern: [southern, Southern]
        west: [west, West]
        system_total: [systemTotal, SystemTotal]
        model: [model, Model]
        in_use: [inUseFlag, InUseFlag]
        dst_flag: [DSTFlag, DSTFlag]
      series:
        coast: "load_fcst:Coast"
        east: "load_fcst:East"
        far_west: "load_fcst:FarWest"
        north: "load_fcst:North"
        north_central: "load_fcst:NorthCentral"
        south_central: "load_fcst:SouthCentral"
        southern: "load_fcst:Southern"
        west: "load_fcst:West"
        system_total: "load_fcst:SystemTotal"
      keep_flag: in_use

  np4-732-cd:
    name: Wind power production, hourly actual and forecast
    archive_id: NP4-732-CD
    endpoint: /np4-732-cd/wpp_hrly_avrg_actl_fcast
    table: series
    cadence: hourly
    interval_minutes: 60
    post_time_ct: "hourly at ~:55"
    schedule: "cron(*/5 * * * ? *)"
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 6
    stale_after_min: 240   # as np3-565-cd
    collected_from: "2026-09-17T11:00:00Z"
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        posted_datetime: [postedDatetime, null]
        delivery_date: [deliveryDate, DELIVERY_DATE]
        hour_ending: [hourEnding, HOUR_ENDING]
        GEN_SYSTEM_WIDE: [genSystemWide, SYSTEM_WIDE_GEN]
        COP_HSL_SYSTEM_WIDE: [COPHSLSystemWide, COP_HSL_SYSTEM_WIDE]
        STWPF_SYSTEM_WIDE: [STWPFSystemWide, STWPF_SYSTEM_WIDE]
        WGRPP_SYSTEM_WIDE: [WGRPPSystemWide, WGRPP_SYSTEM_WIDE]
        GEN_LZ_SOUTH_HOUSTON: [genLoadZoneSouthHouston, GEN_LZ_SOUTH_HOUSTON]
        COP_HSL_LZ_SOUTH_HOUSTON: [COPHSLLoadZoneSouthHouston, COP_HSL_LZ_SOUTH_HOUSTON]
        STWPF_LZ_SOUTH_HOUSTON: [STWPFLoadZoneSouthHouston, STWPF_LZ_SOUTH_HOUSTON]
        WGRPP_LZ_SOUTH_HOUSTON: [WGRPPLoadZoneSouthHouston, WGRPP_LZ_SOUTH_HOUSTON]
        GEN_LZ_WEST: [genLoadZoneWest, GEN_LZ_WEST]
        COP_HSL_LZ_WEST: [COPHSLLoadZoneWest, COP_HSL_LZ_WEST]
        STWPF_LZ_WEST: [STWPFLoadZoneWest, STWPF_LZ_WEST]
        WGRPP_LZ_WEST: [WGRPPLoadZoneWest, WGRPP_LZ_WEST]
        GEN_LZ_NORTH: [genLoadZoneNorth, GEN_LZ_NORTH]
        COP_HSL_LZ_NORTH: [COPHSLLoadZoneNorth, COP_HSL_LZ_NORTH]
        STWPF_LZ_NORTH: [STWPFLoadZoneNorth, STWPF_LZ_NORTH]
        WGRPP_LZ_NORTH: [WGRPPLoadZoneNorth, WGRPP_LZ_NORTH]
        HSL_SYSTEM_WIDE: [HSLSystemWide, SYSTEM_WIDE_HSL]
        dst_flag: [DSTFlag, DSTFlag]
      series:
        GEN_SYSTEM_WIDE: "wind:GEN_SYSTEM_WIDE"
        COP_HSL_SYSTEM_WIDE: "wind:COP_HSL_SYSTEM_WIDE"
        STWPF_SYSTEM_WIDE: "wind:STWPF_SYSTEM_WIDE"
        WGRPP_SYSTEM_WIDE: "wind:WGRPP_SYSTEM_WIDE"
        GEN_LZ_SOUTH_HOUSTON: "wind:GEN_LZ_SOUTH_HOUSTON"
        COP_HSL_LZ_SOUTH_HOUSTON: "wind:COP_HSL_LZ_SOUTH_HOUSTON"
        STWPF_LZ_SOUTH_HOUSTON: "wind:STWPF_LZ_SOUTH_HOUSTON"
        WGRPP_LZ_SOUTH_HOUSTON: "wind:WGRPP_LZ_SOUTH_HOUSTON"
        GEN_LZ_WEST: "wind:GEN_LZ_WEST"
        COP_HSL_LZ_WEST: "wind:COP_HSL_LZ_WEST"
        STWPF_LZ_WEST: "wind:STWPF_LZ_WEST"
        WGRPP_LZ_WEST: "wind:WGRPP_LZ_WEST"
        GEN_LZ_NORTH: "wind:GEN_LZ_NORTH"
        COP_HSL_LZ_NORTH: "wind:COP_HSL_LZ_NORTH"
        STWPF_LZ_NORTH: "wind:STWPF_LZ_NORTH"
        WGRPP_LZ_NORTH: "wind:WGRPP_LZ_NORTH"
        HSL_SYSTEM_WIDE: "wind:HSL_SYSTEM_WIDE"

  np4-737-cd:
    name: Solar power production, hourly actual and forecast
    archive_id: NP4-737-CD
    endpoint: /np4-737-cd/spp_hrly_avrg_actl_fcast
    table: series
    cadence: hourly
    interval_minutes: 60
    post_time_ct: "hourly at ~:55"
    schedule: "cron(*/5 * * * ? *)"
    date_params: [deliveryDateFrom, deliveryDateTo]
    initial_lookback_hours: 6
    stale_after_min: 240   # as np3-565-cd
    collected_from: "2026-09-17T11:00:00Z"
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        posted_datetime: [postedDatetime, null]
        delivery_date: [deliveryDate, DELIVERY_DATE]
        hour_ending: [hourEnding, HOUR_ENDING]
        GEN_SYSTEM_WIDE: [genSystemWide, SYSTEM_WIDE_GEN]
        COP_HSL_SYSTEM_WIDE: [COPHSLSystemWide, COP_HSL_SYSTEM_WIDE]
        STPPF_SYSTEM_WIDE: [STPPFSystemWide, STPPF_SYSTEM_WIDE]
        PVGRPP_SYSTEM_WIDE: [PVGRPPSystemWide, PVGRPP_SYSTEM_WIDE]
        HSL_SYSTEM_WIDE: [HSLSystemWide, SYSTEM_WIDE_HSL]
        dst_flag: [DSTFlag, DSTFlag]
      series:
        GEN_SYSTEM_WIDE: "solar:GEN_SYSTEM_WIDE"
        COP_HSL_SYSTEM_WIDE: "solar:COP_HSL_SYSTEM_WIDE"
        STPPF_SYSTEM_WIDE: "solar:STPPF_SYSTEM_WIDE"
        PVGRPP_SYSTEM_WIDE: "solar:PVGRPP_SYSTEM_WIDE"
        HSL_SYSTEM_WIDE: "solar:HSL_SYSTEM_WIDE"

  np6-788-cd:
    name: SCED LMPs by resource node, load zone and hub, 5-min
    archive_id: NP6-788-CD
    endpoint: /np6-788-cd/lmp_node_zone_hub
    table: spp                # 5-minute grain, settlement_point_type NULL
    cadence: 5min
    interval_minutes: 5
    post_time_ct: "~20 s after each SCED run; listable ~1 min later"
    schedule: "cron(* * * * ? *)"
    date_params: [SCEDTimestampFrom, SCEDTimestampTo]
    initial_lookback_hours: 2
    stale_after_min: 45   # SCED runs every 5 min; normal 1-5 min, observed peak ~10
    collected_from: "2026-09-17T15:05:00Z"
    transform:
      time: sced_timestamp
      columns:                # canonical: [API field, archive CSV header]
        sced_timestamp: [SCEDTimestamp, SCEDTimestamp]
        dst_flag: [repeatHourFlag, RepeatedHourFlag]
        settlement_point: [settlementPoint, SettlementPoint]
        price_mwh: [LMP, LMP]
      keep_point_prefixes: [HB_, LZ_]

  np6-322-cd:
    name: SCED system lambda, 5-min
    archive_id: NP6-322-CD
    endpoint: /np6-322-cd/sced_system_lambda
    table: series
    cadence: 5min
    interval_minutes: 5
    post_time_ct: "~20 s after each SCED run; listable ~1 min later"
    schedule: "cron(* * * * ? *)"
    date_params: [SCEDTimestampFrom, SCEDTimestampTo]
    initial_lookback_hours: 2
    stale_after_min: 45   # as np6-788-cd
    collected_from: "2026-09-17T15:05:00Z"
    transform:
      time: sced_timestamp
      columns:                # canonical: [API field, archive CSV header]
        sced_timestamp: [SCEDTimestamp, SCEDTimeStamp]
        dst_flag: [repeatedHourFlag, RepeatedHourFlag]
        capped: [cappedSystemLambda, CappedSystemLambda]
        uncapped: [uncappedSystemLambda, UncappedSystemLambda]
      series:
        capped: "lambda:capped"
        uncapped: "lambda:uncapped"

  np6-345-cd:
    name: Actual system load by weather zone (hourly, previous operating day)
    archive_id: NP6-345-CD
    endpoint: /np6-345-cd/act_sys_load_by_wzn
    table: series
    cadence: daily
    interval_minutes: 60
    post_time_ct: "~05:50 daily, for the previous operating day (observed)"
    schedule: "cron(0/5 5-7 * * ? *)"   # poll every 5 min 05:00-07:55 CT; first hit takes it
    date_params: [operatingDayFrom, operatingDayTo]
    initial_lookback_hours: 72
    stale_after_min: 1560   # 26 h: today's ~05:50 CT posting still missing at ~07:50 CT, as polling ends
    transform:
      time: hour_ending
      columns:                # canonical: [API field, archive CSV header]
        delivery_date: [operatingDay, OperDay]
        hour_ending: [hourEnding, HourEnding]
        coast: [coast, COAST]
        east: [east, EAST]
        far_west: [farWest, FAR_WEST]
        north: [north, NORTH]
        north_central: [northC, NORTH_C]
        southern: [southern, SOUTHERN]
        south_central: [southC, SOUTH_C]
        west: [west, WEST]
        system_total: [total, TOTAL]
        dst_flag: [DSTFlag, DSTFlag]
      # the same names as the load forecast's, so actual and forecast line up zone by zone
      series:
        coast: "load_act:Coast"
        east: "load_act:East"
        far_west: "load_act:FarWest"
        north: "load_act:North"
        north_central: "load_act:NorthCentral"
        southern: "load_act:Southern"
        south_central: "load_act:SouthCentral"
        west: "load_act:West"
        system_total: "load_act:SystemTotal"
