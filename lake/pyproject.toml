[project]
name = "ercot-lake"
version = "1.0.0"
description = "Read the ercot-pit-lake point-in-time: the lake contract, schemas and a DuckDB reader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Keep this list short: consumers install it next to their own stacks.
dependencies = [
  "duckdb>=1.5",  # to_arrow_table()
  "pyarrow>=17.0",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ercot_lake"]
