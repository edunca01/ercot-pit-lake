[project]
name = "ercot-pit-lake"
version = "1.0.0"
description = "Point-in-time ERCOT market data lake: Public API -> immutable raw -> versioned Parquet on S3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "ercot-lake",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=17.0",
  "boto3>=1.35",
  "openpyxl>=3.1",
]

[project.scripts]
ingest = "ingest.cli:main_ingest"
backfill = "ingest.cli:main_backfill"
compact = "ingest.cli:main_compact"

[tool.uv.workspace]
members = ["lake"]

[tool.uv.sources]
ercot-lake = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "pyarrow-stubs",
  "boto3-stubs[secretsmanager,dynamodb,cloudwatch,sns,logs,ssm]",
  "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "lake/src", "scripts"]
extend-exclude = [".dev", "samples", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "E501", "N803"]
"lake/tests/**" = ["S", "PLR", "PLC0415", "E501"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["ingest", "lake/src", "scripts"]
mypy_path = "lake/src"

[[tool.mypy.overrides]]
module = ["yaml", "dotenv", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "lake/tests"]
pythonpath = ["."]  # scripts/ is operator tooling, not an installed package
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: hits the real ERCOT API; needs credentials (deselected by default)"]

[tool.coverage.run]
source = ["ingest", "ercot_lake"]

[tool.coverage.report]
fail_under = 85
